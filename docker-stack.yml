version: "3.8"

services:
  busca-aereo:
    image: busca-aereo:latest
    environment:
      INTERVAL_SECONDS: "3600"
      INPUT_CSV: /data/voos.csv
      OUTPUT_CSV: /data/resultado_voos.csv
      SUMMARY_OUTPUT: /data/resumo_resultado.txt
      PROFILE_DIR: /data/playwright-profile
      PLAYWRIGHT_BROWSER_CHANNEL: ""
      PYTHON_BIN: python
    volumes:
      - type: bind
        source: ${BUSCA_AEREO_DATA_DIR}
        target: /data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first
